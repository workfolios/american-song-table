name: Deploy American Song Table to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore publication assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/assets/images/editorial
          mkdir -p public/assets/downloads/lead-sheet

          curl --location --fail --retry 3 --retry-delay 2 \
            --output public/assets/images/editorial/american-song-table-summer-2026.jpg \
            "https://drive.usercontent.google.com/download?id=1nyBIfxYHdEHXwoORdShsgq_TYuBaDANN&export=download&confirm=t"

          curl --location --fail --retry 3 --retry-delay 2 \
            --output public/assets/downloads/lead-sheet/the-room-beside-you-lyric-lead-sheet-guitar-chart.pdf \
            "https://drive.usercontent.google.com/download?id=1lbaCpV9Hp_f9Df9L3dcJdJSX3SHfRVMz&export=download&confirm=t"

          curl --location --fail --retry 3 --retry-delay 2 \
            --output public/assets/downloads/lead-sheet/the-room-beside-you-lyric-lead-sheet-mobile-images.zip \
            "https://drive.usercontent.google.com/download?id=1kkWlFtIzxxHbf1SMi0wRyiE9O3IuxDy8&export=download&confirm=t"

          cat <<'CHECKSUMS' | sha256sum --check --strict
          8ff177be64cd6b4960e487c778933044684a747601c494f8a2e254d2f81d78a8  public/assets/images/editorial/american-song-table-summer-2026.jpg
          8bab8dd30eb6929e2279aab70e880a4a341aa74c7fb12bfba5097b61122bbdbd  public/assets/downloads/lead-sheet/the-room-beside-you-lyric-lead-sheet-guitar-chart.pdf
          d01f60e78388cdd22f30b8107072e8c187095ba767f20892edfb0c5158f28486  public/assets/downloads/lead-sheet/the-room-beside-you-lyric-lead-sheet-mobile-images.zip
          CHECKSUMS

      - name: Build production site
        run: npm run build

      - name: Inject social preview metadata
        run: node scripts/inject-social-metadata.mjs

      - name: Verify built publication assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/assets/images/editorial/american-song-table-summer-2026.jpg
          test -s dist/assets/downloads/lead-sheet/the-room-beside-you-lyric-lead-sheet-guitar-chart.pdf
          test -s dist/assets/downloads/lead-sheet/the-room-beside-you-lyric-lead-sheet-mobile-images.zip
          grep --fixed-strings --quiet 'american-song-table-summer-2026.jpg' dist/index.html
          grep --fixed-strings --quiet 'property="og:image"' dist/index.html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
