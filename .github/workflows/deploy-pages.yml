name: Deploy American Song Table to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate and stage publication assets
        shell: bash
        run: |
          set -euo pipefail

          test -s public/assets/media/american-song-table-summer-2026.jpg
          test -s .github/workflows/the-room-beside-you-lyric-lead-sheet-guitar-chart.pdf
          test -s .github/workflows/the-room-beside-you-lyric-lead-sheet-mobile-images.zip

          cat <<'CHECKSUMS' | sha256sum --check --strict
          8ff177be64cd6b4960e487c778933044684a747601c494f8a2e254d2f81d78a8  public/assets/media/american-song-table-summer-2026.jpg
          8bab8dd30eb6929e2279aab70e880a4a341aa74c7fb12bfba5097b61122bbdbd  .github/workflows/the-room-beside-you-lyric-lead-sheet-guitar-chart.pdf
          d01f60e78388cdd22f30b8107072e8c187095ba767f20892edfb0c5158f28486  .github/workflows/the-room-beside-you-lyric-lead-sheet-mobile-images.zip
          CHECKSUMS

          mkdir -p public/assets/downloads/lead-sheet/mobile-images
          cp .github/workflows/the-room-beside-you-lyric-lead-sheet-guitar-chart.pdf \
            public/assets/downloads/lead-sheet/the-room-beside-you-lyric-lead-sheet-guitar-chart.pdf
          cp .github/workflows/the-room-beside-you-lyric-lead-sheet-mobile-images.zip \
            public/assets/downloads/lead-sheet/the-room-beside-you-lyric-lead-sheet-mobile-images.zip

          unzip -p .github/workflows/the-room-beside-you-lyric-lead-sheet-mobile-images.zip \
            'the-room-beside-you-lyric-lead-sheet-mobile-images/the-room-beside-you-lyric-lead-sheet-cover.jpg' \
            > public/assets/downloads/lead-sheet/mobile-images/the-room-beside-you-lyric-lead-sheet-cover.jpg

          unzip -p .github/workflows/the-room-beside-you-lyric-lead-sheet-mobile-images.zip \
            'the-room-beside-you-lyric-lead-sheet-mobile-images/the-room-beside-you-lyrics-page-01.jpg' \
            > public/assets/downloads/lead-sheet/mobile-images/the-room-beside-you-lyrics-page-01.jpg

          unzip -p .github/workflows/the-room-beside-you-lyric-lead-sheet-mobile-images.zip \
            'the-room-beside-you-lyric-lead-sheet-mobile-images/the-room-beside-you-lyrics-page-02.jpg' \
            > public/assets/downloads/lead-sheet/mobile-images/the-room-beside-you-lyrics-page-02.jpg

          cat <<'IMAGE_CHECKSUMS' | sha256sum --check --strict
          d8681662923e8b25188fa44f4acfbc45a2c083f1b66db036f69f9d4c5d586fda  public/assets/downloads/lead-sheet/mobile-images/the-room-beside-you-lyric-lead-sheet-cover.jpg
          ccc07ef5d75f20c0ac77c1a735391b36ba04fc8c482c543204d6c02bf0eda31b  public/assets/downloads/lead-sheet/mobile-images/the-room-beside-you-lyrics-page-01.jpg
          fcb28ac54f864d7d2746c14a144000d2b8d9e450ea242095a983fcb80092e476  public/assets/downloads/lead-sheet/mobile-images/the-room-beside-you-lyrics-page-02.jpg
          IMAGE_CHECKSUMS

      - name: Build production site
        run: npm run build

      - name: Inject responsive visual rhythm
        run: node scripts/inject-visual-rhythm.mjs

      - name: Inject social preview metadata
        run: node scripts/inject-social-metadata.mjs

      - name: Inject mobile lead sheet actions
        run: node scripts/inject-mobile-lead-sheet-actions.mjs

      - name: Verify built publication assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/visual-rhythm.css
          test -s dist/assets/media/american-song-table-summer-2026.jpg
          test -s dist/assets/downloads/lead-sheet/the-room-beside-you-lyric-lead-sheet-guitar-chart.pdf
          test -s dist/assets/downloads/lead-sheet/the-room-beside-you-lyric-lead-sheet-mobile-images.zip
          test -s dist/assets/downloads/lead-sheet/mobile-images/the-room-beside-you-lyric-lead-sheet-cover.jpg
          test -s dist/assets/downloads/lead-sheet/mobile-images/the-room-beside-you-lyrics-page-01.jpg
          test -s dist/assets/downloads/lead-sheet/mobile-images/the-room-beside-you-lyrics-page-02.jpg
          test -s dist/mobile-lead-sheet/index.html
          grep --fixed-strings --quiet 'visual-rhythm.css' dist/index.html
          grep --fixed-strings --quiet 'american-song-table-summer-2026.jpg' dist/index.html
          grep --fixed-strings --quiet 'property="og:image"' dist/index.html
          grep --fixed-strings --quiet 'View Mobile Image Set' dist/index.html
          grep --fixed-strings --quiet 'Download All Mobile Images (.ZIP)' dist/index.html
          grep --fixed-strings --quiet 'the-room-beside-you-lyrics-page-02.jpg' dist/mobile-lead-sheet/index.html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
