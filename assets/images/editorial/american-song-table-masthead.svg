<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="520" viewBox="0 20 2400 520" role="img" aria-labelledby="title desc">
  <title id="title">American Song Table masthead</title>
  <desc id="desc">Production-ready masthead asset for the fictional American music magazine American Song Table, Summer 2026.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .bg { fill: #020814; }
      .cream { fill: #F2EEE8; }
      .sand { fill: #E6D5BB; }
      .orange { fill: #C65332; }
      .orange-stroke { stroke: #C65332; }
      .staff { stroke: #E6D5BB; stroke-opacity: 0.18; stroke-width: 2.5; }
      .american { font-family: 'EB Garamond', 'DejaVu Serif', serif; font-size: 62px; font-weight: 500; letter-spacing: 26px; }
      .wordmark { font-family: 'EB Garamond', 'DejaVu Serif', serif; font-size: 190px; font-weight: 500; letter-spacing: 1px; }
      .season { font-family: 'Inter', 'Lato', 'Arial', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: 4px; }
      .publine { font-family: 'EB Garamond', 'DejaVu Serif', serif; font-size: 45px; font-weight: 500; letter-spacing: 4px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="20" width="2400" height="520"/>

  <text class="american cream" x="1213" y="105" text-anchor="middle">AMERICAN</text>

  <g transform="translate(1955,58)">
    <line class="orange-stroke" x1="0" y1="0" x2="285" y2="0" stroke-width="4"/>
    <text class="season orange" x="142.5" y="52" text-anchor="middle">SUMMER 2026</text>
    <line class="orange-stroke" x1="0" y1="74" x2="285" y2="74" stroke-width="4"/>
  </g>

  <g>
    <line class="staff" x1="40" y1="206" x2="2245" y2="206"/>
    <line class="staff" x1="40" y1="236" x2="2245" y2="236"/>
    <line class="staff" x1="40" y1="266" x2="2245" y2="266"/>
    <line class="staff" x1="40" y1="296" x2="2245" y2="296"/>
    <line class="staff" x1="40" y1="326" x2="2245" y2="326"/>
  </g>

  <g>
    <!-- Custom S-clef path that replaces the generic Unicode G-clef character -->
    <g transform="translate(115, 126) scale(1.85)">
      <path d="M38,135 C38,145 45,150 52,150 C65,150 78,135 78,110 C78,75 48,45 48,15 C48,15 48,140 48,140 C48,144 45,147 41,147 C37,147 34,144 34,140 C34,136 37,133 41,133 C45,133 48,136 48,140 M48,58 C62,64 74,75 74,90 C74,105 64,115 50,115 C35,115 25,102 25,85 C25,62 48,48 48,32 C48,22 41,14 31,14 C22,14 17,21 17,28" fill="none" stroke="#F2EEE8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="wordmark cream" x="285" y="344">ONG TABLE</text>
  </g>

  <g transform="translate(520,420)">
    <line class="orange-stroke" x1="0" y1="0" x2="1710" y2="0" stroke-width="4"/>
    <text class="publine sand" x="855" y="57" text-anchor="middle">THE MAGAZINE OF AMERICAN MUSIC, STORY &amp; SONG</text>
    <line class="orange-stroke" x1="0" y1="83" x2="1710" y2="83" stroke-width="4"/>
  </g>
</svg>
